name: Release

on:
  push:
    tags:
      - 'v*' # Triggert nur bei Version-Tags wie v1.0.2

permissions:
  contents: write # Wichtig: Damit die Action den Release erstellen darf

jobs:
  release:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Mac haben wir hier wie besprochen rausgenommen
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build and Publish
        run: npm run publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_ENV: production